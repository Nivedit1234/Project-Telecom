spring.application.name=subscription-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/subscription_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server
server.port=8083

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# JWT
jwt.secret=${JWT_SECRET}

# Internal services
services.user-service.url=http://localhost:8081
services.catalog-service.url=http://localhost:8082

logging.level.org.springframework.security=DEBUG